<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whispers of the Sirens</title>

<style>
    :root {
        --bg: #e8f4df;
        --panel: #fff8dc;
        --panel-pink: #f9dce5;
        --green: #5f8d68;
        --green-dark: #31583b;
        --pink: #e59ab1;
        --yellow: #f5df91;
        --blue: #a9d8e8;
        --ink: #294333;
        --muted: #6e8374;
        --line: #c5d9c4;
        --white: #fffdf5;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(circle at top left, #f8dce6 0%, transparent 28%),
            radial-gradient(circle at bottom right, #b9dfeb 0%, transparent 28%),
            var(--bg);
        color: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        padding: 40px 18px 60px;
    }

    .wrap { max-width: 620px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; }

    h1 {
        font-size: 1.8rem;
        margin: 0 0 7px;
        color: var(--green-dark);
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .sub {
        font-size: 0.88rem;
        color: var(--muted);
        margin: 0;
        line-height: 1.5;
    }

    .moods {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
    }

    .mood {
        padding: 17px 8px;
        border-radius: 18px;
        background: rgba(255, 253, 245, 0.85);
        border: 2px solid var(--line);
        text-align: center;
        cursor: pointer;
        font-size: 0.82rem;
        color: var(--ink);
        transition: 0.15s ease;
    }

    .mood:hover {
        transform: translateY(-3px);
        border-color: var(--pink);
        box-shadow: 0 7px 18px rgba(70, 100, 75, 0.12);
    }

    .mood.active {
        border-color: var(--pink);
        background: var(--panel-pink);
        box-shadow: 0 7px 18px rgba(70, 100, 75, 0.12);
    }

    .mood .emoji {
        font-size: 1.55rem;
        display: block;
        margin-bottom: 7px;
    }

    .result {
        display: none;
        background: rgba(255, 253, 245, 0.94);
        border: 2px solid var(--line);
        border-radius: 22px;
        padding: 23px;
        box-shadow: 0 10px 30px rgba(70, 100, 75, 0.1);
    }

    .result.show {
        display: block;
        animation: appear 0.25s ease;
    }

    @keyframes appear {
        from { opacity: 0; transform: translateY(7px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .playlist-name {
        font-size: 1.2rem;
        color: var(--green-dark);
        margin: 0 0 5px;
        font-weight: 700;
    }

    .playlist-tag {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 0 0 18px;
    }

    .songs {
        display: grid;
        gap: 12px;
    }

    .song-card {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 8px;
        overflow: hidden;
    }

    .song-number {
        font-size: 0.72rem;
        color: var(--muted);
        margin: 3px 7px 6px;
    }

    iframe {
        display: block;
        width: 100%;
        height: 80px;
        border: 0;
        border-radius: 10px;
    }

    .reroll {
        margin-top: 16px;
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 2px solid #e2ca6e;
        background: var(--yellow);
        color: var(--green-dark);
        font-weight: 700;
        cursor: pointer;
        font-size: 0.9rem;
        transition: 0.12s ease;
    }

    .reroll:hover {
        transform: translateY(-2px);
        background: #f8e6a7;
    }

    footer {
        margin-top: 26px;
        text-align: center;
        font-size: 0.72rem;
        color: var(--muted);
        font-style: italic;
        line-height: 1.5;
    }

    .count {
        display: inline-block;
        margin-top: 5px;
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--blue);
        color: var(--green-dark);
        font-style: normal;
    }

    @media (max-width: 400px) {
        .moods { gap: 8px; }
        .mood { padding: 14px 5px; font-size: 0.76rem; }
        .result { padding: 18px; }
    }
</style>
</head>

<body>
<div class="wrap">

<header>
    <h1>the jukebox knows 🎀</h1>
    <p class="sub">
        choose your mood, and it will pull six songs
        from your Spotify liked songs.
    </p>
</header>

<div class="moods" id="moods"></div>

<div class="result" id="result">
    <p class="playlist-name" id="pName"></p>
    <p class="playlist-tag" id="pTag"></p>
    <div class="songs" id="pList"></div>
    <button class="reroll" id="reroll">shuffle a different six ✨</button>
</div>

<footer>
    songs are selected from your supplied Spotify liked-song links.
    <br>
    <span class="count">3,737 Spotify tracks loaded</span>
</footer>

</div>

const MOODS = {
    sunny: {
        emoji: "☀️",
        tag: "bright, warm, a little breezy",
        names: ["Golden Hour Errands", "Windows Down", "Sidewalk Chalk"]
    },

    cozy: {
        emoji: "🌙",
        tag: "slow evenings, low light",
        names: ["Blanket Fort Radio", "Tea Gone Cold", "Rainy Window Seat"]
    },

    heartbreak: {
        emoji: "💔",
        tag: "the ache, and then the healing",
        names: ["Parking Lot Cry", "Text Left on Read", "Slow Rebuild"]
    },

    hype: {
        emoji: "🔥",
        tag: "main character, main volume",
        names: ["Villain Origin Story", "Locker Room Speech", "Red Light District"]
    },

    focus: {
        emoji: "🧠",
        tag: "heads down, headphones on",
        names: ["Do Not Disturb", "Tunnel Vision", "Silent Library"]
    },

    nostalgic: {
        emoji: "📼",
        tag: "old bedroom, old feelings",
        names: ["Rewind Tape", "Glovebox Mixtape", "2013 Reboot"]
    }
};

const moodsEl = document.getElementById("moods");

Object.entries(MOODS).forEach(([key, mood]) => {
    const div = document.createElement("div");
    div.className = "mood";
    div.dataset.mood = key;
    div.innerHTML = `<span class="emoji">${mood.emoji}</span>${key}`;
    moodsEl.appendChild(div);
});

function shuffle(array) {
    const shuffled = [...array];

    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    return shuffled;
}

let currentMood = null;

function showPlaylist(key) {
    const mood = MOODS[key];
    const picks = shuffle(TRACK_IDS).slice(0, 6);

    document.getElementById("pName").textContent =
        mood.names[Math.floor(Math.random() * mood.names.length)];

    document.getElementById("pTag").textContent = mood.tag;

    const list = document.getElementById("pList");
    list.innerHTML = "";

    picks.forEach((id, index) => {
        const card = document.createElement("div");
        card.className = "song-card";

        card.innerHTML = `
            <div class="song-number">track ${index + 1}</div>
            <iframe
                src="https://open.spotify.com/embed/track/${id}?utm_source=generator&theme=0"
                loading="lazy"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                allowfullscreen>
            </iframe>
        `;

        list.appendChild(card);
    });

    document.getElementById("result").classList.add("show");
}

moodsEl.addEventListener("click", (event) => {
    const card = event.target.closest(".mood");
    if (!card) return;

    document.querySelectorAll(".mood")
        .forEach(item => item.classList.remove("active"));

    card.classList.add("active");
    currentMood = card.dataset.mood;
    showPlaylist(currentMood);
});

document.getElementById("reroll").addEventListener("click", () => {
    if (currentMood) showPlaylist(currentMood);
});
